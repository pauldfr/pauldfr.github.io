{% include base_path %}

<!-- start custom head snippets -->

<!-- Fonts: Source Serif 4 (body) + Source Sans 3 (headings, nav) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400;1,8..60,600&display=swap" rel="stylesheet">
<style>
  /* keep the top navigation in the sans face alongside sans headings */
  .masthead, .greedy-nav a {
    font-family: "Source Sans 3", -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
</style>

<!-- Support for Academicons -->
<link rel="preload" href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css"></noscript>

<!-- Support for Font Awesome -->
 <link rel="preload" href="{{ base_path }}/assets/css/fontawesome.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="{{ base_path }}/assets/css/fontawesome.css"></noscript>

<!-- square favicon carried over from pauldfr.com -->
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon-180x180.png"/>
<link rel="icon" type="image/svg+xml" href="{{ base_path }}/images/favicon.svg"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-32x32.png" sizes="32x32"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-192x192.png" sizes="192x192"/>
<link rel="manifest" href="{{ base_path }}/images/manifest.json"/>
<link rel="icon" href="/images/favicon.ico"/>
<meta name="theme-color" content="var(--global-bg-color)"/>

<!-- compact publication listings -->
<style>
  .archive .list__item .archive__item-title {
    font-size: 1.05em;
    margin: 0.5em 0 0.1em;
  }
  .archive .list__item .archive__item { margin-bottom: 0.35em; }
  .archive .list__item .archive__item p { margin: 0.15em 0; }
</style>

<!-- collapsible abstracts on publication listings -->
<style>
  .abstract-details { margin: 0.25em 0 0.75em; }
  .abstract-details summary {
    cursor: pointer;
    font-size: 0.8em;
    color: var(--global-text-color-light, #666);
  }
  .abstract-details[open] summary { margin-bottom: 0.25em; }
  .abstract-details p {
    font-size: 0.8em;
    margin: 0 0 0.5em;
    padding-left: 1em;
    border-left: 2px solid var(--global-border-color, #ddd);
  }
</style>

<!-- end custom head snippets -->
